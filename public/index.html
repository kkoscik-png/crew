<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Rotation Schedule — Stena Scandica</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5b6675;
    --border: #e1e5ea;
    --accent: #0a5c8a;
    --accent-2: #0e7fbf;
    --onboard: #0f7a3d;
    --onboard-bg: #e6f6ec;
    --home: #a15c00;
    --home-bg: #fff2e0;
    --port-v: #189752;
    --port-n: #d1382c;
    --vacation: #a1780a;
    --vacation-bg: #fff4d6;
    --shadow: 0 1px 3px rgba(20,30,40,0.08), 0 1px 2px rgba(20,30,40,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1620;
      --card: #17212c;
      --text: #e8edf2;
      --muted: #8fa0b3;
      --border: #26333f;
      --accent: #4fb3e8;
      --accent-2: #6cc4f0;
      --onboard: #4ade80;
      --onboard-bg: #123322;
      --home: #f5b155;
      --home-bg: #33270f;
      --port-v: #2fbf71;
      --port-n: #f0574a;
      --vacation: #f0c33e;
      --vacation-bg: #3a2e0a;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  .nav-row { margin-bottom: 20px; }
  .navbtn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.85rem; font-weight: 600; text-decoration: none;
    color: var(--accent); background: var(--card); border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 10px; box-shadow: var(--shadow);
  }
  .navbtn:hover { border-color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  select {
    width: 100%;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .status-badge.onboard { background: var(--onboard-bg); color: var(--onboard); }
  .status-badge.home { background: var(--home-bg); color: var(--home); }
  .status-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .rows { display: grid; gap: 10px; margin-top: 4px; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; }
  h2 { font-size: 1rem; margin: 0 0 10px; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .03em; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 6px 0; }
  .meta { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 28px; line-height: 1.6; }
  .meta a { color: var(--accent-2); text-decoration: none; }
  .placeholder { color: var(--muted); text-align: center; padding: 30px 0; }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 0.74rem; color: var(--muted); margin-bottom: 10px; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .cal-legend .swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--onboard-bg); border: 1px solid var(--onboard); display: inline-block; }
  .cal-legend .swatch.vacation { background: var(--vacation-bg); border-color: var(--vacation); }
  .cal-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .cal-title { font-weight: 600; font-size: 0.92rem; margin: 18px 0 10px; color: var(--text); text-align: center; }
  .cal-title:first-of-type { margin-top: 0; }
  .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-weekdays { margin-bottom: 6px; }
  .cal-weekdays div { text-align: center; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
  .cal-cell {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-top-left-radius: 8px; border-top-right-radius: 8px; font-size: 0.8rem; color: var(--text); overflow: hidden;
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.past { color: var(--muted); }
  .cal-cell.onboard { background: var(--onboard-bg); color: var(--onboard); font-weight: 700; }
  .cal-cell.vacation { background: var(--vacation-bg); color: var(--vacation); font-weight: 700; }
  .cal-cell.today { box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 700; }
  .cal-cell .portbar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; }
  .cal-cell .vac-label {
    position: absolute; left: 0; right: 0; bottom: 6px;
    font-size: 0.36rem; font-weight: 700; letter-spacing: .01em; text-transform: uppercase;
    text-align: center; line-height: 1.3; color: var(--vacation);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Crew Rotation Schedule</h1>
  <p class="subtitle">Stena Scandica — select your name to see your next crew change.</p>

  <div class="nav-row"><a class="navbtn" href="/timetable">🚢 Ship timetable</a></div>

  <div class="card">
    <label for="person">Name</label>
    <select id="person">
      <option value="">— select —</option>
    </select>
  </div>

  <div id="result"></div>

  <p class="meta" id="meta"></p>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function fmt(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${MONTHS[m-1]} ${d}, ${y} (${WEEKDAYS[dt.getDay()]})`;
}

function todayIso() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function addDays(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function isoYMD(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
// Monday-first weekday index (0 = Monday ... 6 = Sunday)
function firstWeekdayMonFirst(y, m) { return (new Date(y, m, 1).getDay() + 6) % 7; }

function isOnboardDate(person, iso) {
  return person.intervals.some(iv => iso >= iv.start && iso <= iv.end);
}

// "V" in the Planning sheet = Vacation.
function isVacationDate(person, iso) {
  return (person.vacationIntervals || []).some(iv => iso >= iv.start && iso <= iv.end);
}

// Before the PDF timetable's cycle-start date, the ship ran a simple
// single-port-per-day pattern that isn't in the PDF: confirmed anchor is
// August 25, 2026 = Ventspils, alternating with Nynäshamn every day.
// This is only known to hold for Aug 5 – Sep 5, 2026 (the day before the
// PDF's cycle takes over on Sep 6).
const PRE_CYCLE_START = '2026-08-05';
const PRE_CYCLE_END = '2026-09-05';
const PRE_CYCLE_ANCHOR_ISO = '2026-08-25'; // Ventspils

function preCyclePortDay(iso) {
  if (iso < PRE_CYCLE_START || iso > PRE_CYCLE_END) return null;
  const [ay, am, ad] = PRE_CYCLE_ANCHOR_ISO.split('-').map(Number);
  const [y, m, d] = iso.split('-').map(Number);
  const anchor = Date.UTC(ay, am - 1, ad);
  const cur = Date.UTC(y, m - 1, d);
  const diff = Math.round((cur - anchor) / 86400000);
  const isVentspils = ((diff % 2) + 2) % 2 === 0;
  return isVentspils ? { v: ['00:00', '23:59'] } : { n: ['00:00', '23:59'] };
}

// Look up the ship's day-plan for any date: the manual pre-cycle pattern
// above for Aug 5 – Sep 5, 2026, otherwise projected onto the repeating
// timetable cycle read from the PDF (works for dates inside or long after
// the cycle's anchor date).
function shipDayForDate(tt, iso) {
  const pre = preCyclePortDay(iso);
  if (pre) return pre;
  if (!tt || !tt.cycleStartIso || !tt.cycleDays || !tt.cycleDays.length) return null;
  const [sy, sm, sd] = tt.cycleStartIso.split('-').map(Number);
  const [y, m, d] = iso.split('-').map(Number);
  const start = Date.UTC(sy, sm - 1, sd);
  const cur = Date.UTC(y, m - 1, d);
  const diff = Math.round((cur - start) / 86400000);
  const L = tt.cycleDays.length;
  const idx = ((diff % L) + L) % L;
  return tt.cycleDays[idx];
}

function timeToMins(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

// Bottom-of-tile port bar: solid green if only Ventspils that day, solid red
// if only Nynäshamn. If the ship calls at both ports that day, split the bar
// 50/50 in chronological order — whichever port it's at in the morning goes
// on the left, the port it moves to later goes on the right.
function portBarStyle(day) {
  if (!day) return null;
  const hasV = !!day.v, hasN = !!day.n;
  if (hasV && hasN) {
    const vArr = timeToMins(day.v[0]);
    const nArr = timeToMins(day.n[0]);
    const vFirst = vArr === null || nArr === null ? true : vArr <= nArr;
    return vFirst
      ? 'background: linear-gradient(to right, var(--port-v) 50%, var(--port-n) 50%);'
      : 'background: linear-gradient(to right, var(--port-n) 50%, var(--port-v) 50%);';
  }
  if (hasV) return 'background: var(--port-v);';
  if (hasN) return 'background: var(--port-n);';
  return null;
}

function renderCalendar(person) {
  const now = new Date();
  const todayStr = todayIso();
  let html = '<div class="card"><h2>Calendar — next 3 months</h2>';
  html += '<div class="cal-legend">' +
    '<span><span class="swatch"></span>On board</span>' +
    '<span><span class="swatch vacation"></span>Vacation</span>' +
    '<span><i style="background:var(--port-v)"></i>Ventspils</span>' +
    '<span><i style="background:var(--port-n)"></i>Nynäshamn</span>' +
    '<span><i style="background:linear-gradient(to right,var(--port-v) 50%,var(--port-n) 50%)"></i>Both ports</span>' +
    '</div>';
  html += '<div class="cal-months">';
  for (let i = 0; i < 3; i++) {
    const y = now.getFullYear();
    const m = now.getMonth() + i;
    const dt = new Date(y, m, 1);
    const dy = dt.getFullYear();
    const dm = dt.getMonth();
    const dim = daysInMonth(dy, dm);
    const lead = firstWeekdayMonFirst(dy, dm);

    html += `<div class="cal-title">${MONTHS[dm]} ${dy}</div>`;
    html += '<div class="cal-weekdays"><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div></div>';
    html += '<div class="cal-days">';
    for (let k = 0; k < lead; k++) html += '<div class="cal-cell empty"></div>';
    for (let day = 1; day <= dim; day++) {
      const iso = isoYMD(dy, dm, day);
      const isVac = isVacationDate(person, iso);
      const classes = ['cal-cell'];
      if (isOnboardDate(person, iso)) classes.push('onboard');
      if (isVac) classes.push('vacation');
      if (iso === todayStr) classes.push('today');
      if (iso < todayStr) classes.push('past');
      const barStyle = portBarStyle(shipDayForDate(TIMETABLE, iso));
      const bar = barStyle ? `<span class="portbar" style="${barStyle}"></span>` : '';
      const vacLabel = isVac ? '<span class="vac-label">Vacation</span>' : '';
      html += `<div class="${classes.join(' ')}">${day}${vacLabel}${bar}</div>`;
    }
    html += '</div>';
  }
  html += '</div>'; // .cal-months
  html += '</div>'; // .card
  return html;
}

function computeStatus(person, todayIsoStr) {
  const intervals = person.intervals;
  const currentIdx = intervals.findIndex(iv => todayIsoStr >= iv.start && todayIsoStr <= iv.end);
  if (currentIdx !== -1) {
    const cur = intervals[currentIdx];
    return {
      state: 'onboard',
      currentInterval: cur,
      // The last marked (working) cell in the Excel sheet IS the day the
      // person goes home — not the day after.
      goesHomeOn: cur.end,
      upcoming: intervals.slice(currentIdx + 1),
    };
  }
  const nextIdx = intervals.findIndex(iv => iv.start > todayIsoStr);
  if (nextIdx !== -1) {
    const next = intervals[nextIdx];
    return {
      state: 'home',
      nextBoarding: next.start,
      nextLeavingHome: next.end,
      upcoming: intervals.slice(nextIdx + 1),
    };
  }
  return { state: 'unknown', upcoming: [] };
}

let SCHEDULE = null;
let TIMETABLE = null;

async function load() {
  const [res, ttRes] = await Promise.all([fetch('/api/schedule'), fetch('/api/timetable')]);
  SCHEDULE = await res.json();
  TIMETABLE = await ttRes.json();
  const select = document.getElementById('person');
  for (const p of SCHEDULE.people) {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    select.appendChild(opt);
  }
  const meta = document.getElementById('meta');
  const genDate = SCHEDULE.generatedAt ? new Date(SCHEDULE.generatedAt).toLocaleString('en-GB') : '—';
  meta.innerHTML = `Data last updated: ${genDate} · year ${SCHEDULE.sheetYear || ''}<br><a href="/admin">Admin panel</a>`;

  const saved = sessionStorage.getItem('selectedPersonId');
  if (saved) {
    select.value = saved;
    render();
  }

  document.getElementById('placeholder')?.remove();
}

function render() {
  const select = document.getElementById('person');
  const id = select.value;
  const result = document.getElementById('result');
  if (!id) {
    result.innerHTML = '';
    sessionStorage.removeItem('selectedPersonId');
    return;
  }
  sessionStorage.setItem('selectedPersonId', id);
  const person = SCHEDULE.people.find(p => p.id === id);
  const today = todayIso();
  const status = computeStatus(person, today);

  let html = '<div class="card">';
  if (status.state === 'onboard') {
    html += `<div class="status-badge onboard"><span class="dot"></span> On board</div>`;
    html += `<div class="rows">
      <div class="row"><span class="k">On board since</span><span class="v">${fmt(status.currentInterval.start)}</span></div>
      <div class="row"><span class="k">Goes home on</span><span class="v">${fmt(status.goesHomeOn)}</span></div>
    </div>`;
  } else if (status.state === 'home') {
    html += `<div class="status-badge home"><span class="dot"></span> At home</div>`;
    html += `<div class="rows">
      <div class="row"><span class="k">Boards the ship on</span><span class="v">${fmt(status.nextBoarding)}</span></div>
      <div class="row"><span class="k">Goes home again on (end of that rotation)</span><span class="v">${fmt(status.nextLeavingHome)}</span></div>
    </div>`;
  } else {
    html += `<div class="placeholder">No scheduled changes found in the available data for this person.</div>`;
  }
  html += '</div>';

  html += '<div class="card"><h2>Upcoming changes until year end</h2>';
  if (status.upcoming && status.upcoming.length > 0) {
    html += '<table><thead><tr><th>Boards the ship</th><th>Goes home</th></tr></thead><tbody>';
    for (const iv of status.upcoming) {
      html += `<tr><td>${fmt(iv.start)}</td><td>${fmt(iv.end)}</td></tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<div class="empty">No further scheduled changes until year end.</div>';
  }
  html += '</div>';

  html += renderCalendar(person);

  result.innerHTML = html;
}

document.getElementById('person').addEventListener('change', render);
load();
</script>
</body>
</html>
