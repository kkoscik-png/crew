<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Rotation Schedule — Stena Scandica</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5b6675;
    --border: #e1e5ea;
    --accent: #0a5c8a;
    --accent-2: #0e7fbf;
    --onboard: #0f7a3d;
    --onboard-bg: #e6f6ec;
    --home: #a15c00;
    --home-bg: #fff2e0;
    --shadow: 0 1px 3px rgba(20,30,40,0.08), 0 1px 2px rgba(20,30,40,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1620;
      --card: #17212c;
      --text: #e8edf2;
      --muted: #8fa0b3;
      --border: #26333f;
      --accent: #4fb3e8;
      --accent-2: #6cc4f0;
      --onboard: #4ade80;
      --onboard-bg: #123322;
      --home: #f5b155;
      --home-bg: #33270f;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  select {
    width: 100%;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .status-badge.onboard { background: var(--onboard-bg); color: var(--onboard); }
  .status-badge.home { background: var(--home-bg); color: var(--home); }
  .status-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .rows { display: grid; gap: 10px; margin-top: 4px; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; }
  h2 { font-size: 1rem; margin: 0 0 10px; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .03em; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 6px 0; }
  .meta { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 28px; line-height: 1.6; }
  .meta a { color: var(--accent-2); text-decoration: none; }
  .placeholder { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Crew Rotation Schedule</h1>
  <p class="subtitle">Stena Scandica — select your name to see your next crew change.</p>

  <div class="card">
    <label for="person">Name</label>
    <select id="person">
      <option value="">— select —</option>
    </select>
  </div>

  <div id="result"></div>

  <p class="meta" id="meta"></p>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function fmt(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${MONTHS[m-1]} ${d}, ${y} (${WEEKDAYS[dt.getDay()]})`;
}

function todayIso() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function addDays(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}

function computeStatus(person, todayIsoStr) {
  const intervals = person.intervals;
  const currentIdx = intervals.findIndex(iv => todayIsoStr >= iv.start && todayIsoStr <= iv.end);
  if (currentIdx !== -1) {
    const cur = intervals[currentIdx];
    return {
      state: 'onboard',
      currentInterval: cur,
      // The last marked (working) cell in the Excel sheet IS the day the
      // person goes home — not the day after.
      goesHomeOn: cur.end,
      upcoming: intervals.slice(currentIdx + 1),
    };
  }
  const nextIdx = intervals.findIndex(iv => iv.start > todayIsoStr);
  if (nextIdx !== -1) {
    const next = intervals[nextIdx];
    return {
      state: 'home',
      nextBoarding: next.start,
      nextLeavingHome: next.end,
      upcoming: intervals.slice(nextIdx + 1),
    };
  }
  return { state: 'unknown', upcoming: [] };
}

let SCHEDULE = null;

async function load() {
  const res = await fetch('/api/schedule');
  SCHEDULE = await res.json();
  const select = document.getElementById('person');
  for (const p of SCHEDULE.people) {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    select.appendChild(opt);
  }
  const meta = document.getElementById('meta');
  const genDate = SCHEDULE.generatedAt ? new Date(SCHEDULE.generatedAt).toLocaleString('en-GB') : '—';
  meta.innerHTML = `Data last updated: ${genDate} · year ${SCHEDULE.sheetYear || ''}<br><a href="/admin">Admin panel</a>`;

  const saved = sessionStorage.getItem('selectedPersonId');
  if (saved) {
    select.value = saved;
    render();
  }

  document.getElementById('placeholder')?.remove();
}

function render() {
  const select = document.getElementById('person');
  const id = select.value;
  const result = document.getElementById('result');
  if (!id) {
    result.innerHTML = '';
    sessionStorage.removeItem('selectedPersonId');
    return;
  }
  sessionStorage.setItem('selectedPersonId', id);
  const person = SCHEDULE.people.find(p => p.id === id);
  const today = todayIso();
  const status = computeStatus(person, today);

  let html = '<div class="card">';
  if (status.state === 'onboard') {
    html += `<div class="status-badge onboard"><span class="dot"></span> On board</div>`;
    html += `<div class="rows">
      <div class="row"><span class="k">On board since</span><span class="v">${fmt(status.currentInterval.start)}</span></div>
      <div class="row"><span class="k">Goes home on</span><span class="v">${fmt(status.goesHomeOn)}</span></div>
    </div>`;
  } else if (status.state === 'home') {
    html += `<div class="status-badge home"><span class="dot"></span> At home</div>`;
    html += `<div class="rows">
      <div class="row"><span class="k">Boards the ship on</span><span class="v">${fmt(status.nextBoarding)}</span></div>
      <div class="row"><span class="k">Goes home again on (end of that rotation)</span><span class="v">${fmt(status.nextLeavingHome)}</span></div>
    </div>`;
  } else {
    html += `<div class="placeholder">No scheduled changes found in the available data for this person.</div>`;
  }
  html += '</div>';

  html += '<div class="card"><h2>Upcoming changes until year end</h2>';
  if (status.upcoming && status.upcoming.length > 0) {
    html += '<table><thead><tr><th>Boards the ship</th><th>Goes home</th></tr></thead><tbody>';
    for (const iv of status.upcoming) {
      html += `<tr><td>${fmt(iv.start)}</td><td>${fmt(iv.end)}</td></tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<div class="empty">No further scheduled changes until year end.</div>';
  }
  html += '</div>';

  result.innerHTML = html;
}

document.getElementById('person').addEventListener('change', render);
load();
</script>
</body>
</html>
